name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall запускает `prisma generate`: клиент нужен и проверке типов, и сборке.
      - run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          # Нужен только для того, чтобы сборка не ругалась на отсутствие секрета; настоящим не является.
          AUTH_SECRET: ci-build-only-not-a-secret
